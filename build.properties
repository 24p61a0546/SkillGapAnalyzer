# =====================================================================
# Skill Gap Analyzer - Ant Build Configuration
# =====================================================================

app.name=SkillGapAnalyzer
app.version=1.0.0

# Source and Web Directories
src.dir=src
web.dir=WebContent
webinf.dir=${web.dir}/WEB-INF
lib.dir=lib
dist.dir=dist
build.dir=build
classes.dir=${build.dir}/classes

# Java compiler settings
javac.debug=true
javac.deprecation=false
javac.optimize=true
javac.source=1.8
javac.target=1.8
javac.encoding=UTF-8

# Tomcat Deployment Path (Customize if deploying directly to local Tomcat)
# Example: tomcat.home=C:/apache-tomcat-9.0.86
tomcat.home=C:/apache-tomcat
tomcat.webapps=${tomcat.home}/webapps
