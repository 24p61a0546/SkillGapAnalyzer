version: '3.8'

services:
  # MySQL Database Service
  mysql-db:
    image: mysql:8.0
    container_name: skillgap-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: skill_gap_db
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seed_data.sql:/docker-entrypoint-initdb.d/02_seed.sql
    networks:
      - skillgap-network

  # Tomcat Application Service
  web-app:
    build: .
    container_name: skillgap-tomcat
    restart: always
    depends_on:
      - mysql-db
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql-db
      DB_PORT: 3306
      DB_NAME: skill_gap_db
      DB_USER: root
      DB_PASS: root
    networks:
      - skillgap-network

networks:
  skillgap-network:
    driver: bridge

volumes:
  mysql-data:
